name: App CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run export:native
      - uses: actions/upload-artifact@v4
        with:
          name: web-exports
          path: apps/*/dist/web
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none .github/scripts/delivery-policy.test.mjs .github/scripts/pr-preflight.test.mjs .github/scripts/migration-policy.test.mjs .github/scripts/trusted-migration-policy.test.mjs .github/scripts/validate-migration-policy.test.mjs

  postgis-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations and row isolation
        run: tests/database/run.sh

  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and test dispatcher
        run: deno test supabase/functions/dispatch-notifications/dispatch_test.ts && deno check supabase/functions/dispatch-notifications/index.ts
      - name: Typecheck and test owner code request and Send SMS hook
        run: |
          deno test supabase/functions/request-owner-code/handler_test.ts supabase/functions/send-sms-hook/hook_test.ts
          deno check supabase/functions/request-owner-code/index.ts supabase/functions/send-sms-hook/index.ts
      - name: Typecheck and test dish photo validation and lifecycle
        working-directory: supabase/functions/menu-photos
        run: deno test --frozen --allow-read photos_test.ts && deno check --frozen index.ts
