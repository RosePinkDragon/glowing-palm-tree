name: Delivery policy gate
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted, transferred]
  push:
    branches: [main]
concurrency:
  group: delivery-policy-repository
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Evaluate live metadata and publish check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/run-delivery-policy.mjs
