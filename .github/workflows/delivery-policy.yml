name: Delivery policy gate
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted, transferred]
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate live metadata and publish check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 policy/runner.py
