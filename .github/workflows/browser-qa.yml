name: Browser QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://market-fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web --workspace ammu-sammu-customer
      - run: npm run build:web --workspace kokani-dine-inn-customer
      - run: npm run build:web --workspace ammu-sammu-admin
      - run: npm run test:browser
      - run: node tests/browser/cart.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: dist/browser
          if-no-files-found: ignore
