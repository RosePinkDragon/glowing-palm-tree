[functions.dispatch-notifications]
verify_jwt = false

[functions.menu-photos]
# The handler verifies the bearer with Auth.getUser before any privileged action.
verify_jwt = false
# Run `deno install --frozen` in the function directory before CLI bundling.
static_files = ["./functions/menu-photos/node_modules/@imagemagick/magick-wasm/dist/x86/magick.wasm"]

# Edge Functions for WhatsApp one-time-code login (#50). Both are public endpoints that authenticate themselves
# (a signed hook request; CAPTCHA, rate limits and the owner check), so the gateway JWT check is off.
[functions.request-owner-code]
verify_jwt = false

[functions.send-sms-hook]
verify_jwt = false

# Phone login by one-time code (#50). Codes are sent by the send_sms hook below, as a WhatsApp authentication
# template through MSG91, so no SMS provider is configured here. Needs a Supabase CLI that knows
# `otp_expiry` under [auth.sms] (3.x). Hosted projects: set the same values in the dashboard, see docs/RELEASE.md.
[auth.sms]
enabled = true
enable_confirmations = false
template = "Your code is {{ .Code }}"
# Minimum time before another code can be requested for the same number (the apps show this as a cooldown).
max_frequency = "30s"
otp_length = 6
# 10 minutes. Supabase's own default is much longer.
otp_expiry = 600

# Production-safe by default (#212): no test OTP numbers, CAPTCHA on with the secret from the environment. This file is
# the committed default and must stay safe to apply to a hosted project; `.github/scripts/hosted-auth-config.mjs` fails CI
# if it is not. Local fixtures (two fictional test numbers, CAPTCHA off, local hook address) live in `supabase/config.local.toml`
# and are applied only to a git-ignored generated workdir: `npm run supabase:local-config` (see docs/RELEASE.md).
# Hosted Auth is still configured in the dashboard; never run `supabase config push` or `supabase link` from this repository.
# Enabled CAPTCHA needs the real Turnstile secret as SUPABASE_AUTH_CAPTCHA_SECRET and EXPO_PUBLIC_TURNSTILE_SITE_KEY in the apps.
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# Auth sends every code here. Hosted projects: the dashboard generates the secret ("v1,whsec_...") and the same value
# is the SEND_SMS_HOOK_SECRET function secret. The uri below is a non-local placeholder (the dashboard holds the real
# one); the local workdir overlay replaces it with the local functions address. Local secret: see docs/RELEASE.md.
[auth.hook.send_sms]
enabled = true
uri = "https://project-ref.functions.supabase.co/functions/v1/send-sms-hook"
secrets = "env(SUPABASE_AUTH_HOOK_SEND_SMS_SECRET)"
